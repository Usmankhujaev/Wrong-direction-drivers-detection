name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Core logic modules (geometry, direction, zones, events, config) are
      # torch/opencv-free by design, so CI stays fast: no GPU stack needed.
      - run: pip install numpy pyyaml pytest ruff
      - run: ruff check .
      - run: pytest -q
